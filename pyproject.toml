[project]
name = "text-summary"
version = "0.1.0"
description = "Summarizes YouTube videos from their available captions"
readme = "README.md"
authors = [
    { email = "sonaliak1999@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "gradio>=5,<6",
    "torch>=2.15.0",
    "transformers>=4.57.1,<5.0.0",
    "youtube-transcript-api>=1.2.5",
]

[project.scripts]
text-summary = "text_summarization:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "text_summarization"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
